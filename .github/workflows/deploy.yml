name: Despliegue Produccion Portfolio

on:
  push:
    branches: ['main']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Los tipos también son parte del contrato. Se comprobaban a mano y en
      # local, así que nada impedía desplegar un fallo que `astro check` ya
      # sabía ver: ahora corre antes que el build y para la línea igual.
      - name: Comprobar tipos
        run: npm run check
      - name: Build
        run: npm run build
      # El despliegue solo continúa si el build cumple el contrato por los dos
      # lados: el HTML sin JavaScript (URLs, lang, canonical, hreflang, sitemap,
      # JSON-LD, H1, enlaces, imágenes, anclas heredadas, presupuesto de peso)
      # y la capa de interacción ejecutando el bundle real contra ese mismo HTML.
      - name: Verificar dist e interacción
        run: npm run verify
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

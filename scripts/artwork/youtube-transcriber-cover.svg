<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1000" viewBox="0 0 2000 1000" role="img">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#05080f"/>
      <stop offset=".56" stop-color="#070b18"/>
      <stop offset="1" stop-color="#0d0b20"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="74%" cy="18%" r="40%">
      <stop stop-color="#2b6bff" stop-opacity=".32"/>
      <stop offset=".45" stop-color="#5b9bff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#05080f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-glow" cx="68%" cy="52%" r="46%">
      <stop stop-color="#b14aed" stop-opacity=".28"/>
      <stop offset=".42" stop-color="#5b2a86" stop-opacity=".1"/>
      <stop offset="1" stop-color="#05080f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#0a0f1c" stop-opacity=".1"/>
      <stop offset=".22" stop-color="#101638" stop-opacity=".65"/>
      <stop offset=".64" stop-color="#15153e" stop-opacity=".78"/>
      <stop offset="1" stop-color="#0a0f1c" stop-opacity=".14"/>
    </linearGradient>
    <linearGradient id="active-row" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#2b6bff" stop-opacity=".12"/>
      <stop offset=".68" stop-color="#b14aed" stop-opacity=".18"/>
      <stop offset="1" stop-color="#b14aed" stop-opacity=".02"/>
    </linearGradient>
    <linearGradient id="karaoke" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#5b9bff"/>
      <stop offset=".43" stop-color="#b14aed"/>
      <stop offset=".44" stop-color="#edf1f8"/>
      <stop offset="1" stop-color="#edf1f8"/>
    </linearGradient>
    <linearGradient id="lower-vignette" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#05080f" stop-opacity="0"/>
      <stop offset=".34" stop-color="#05080f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#05080f" stop-opacity=".96"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#5b9bff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="blue-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="2000" height="1000" fill="url(#background)"/>
  <rect width="2000" height="1000" fill="url(#grid)"/>
  <rect width="2000" height="1000" fill="url(#blue-glow)"/>
  <rect width="2000" height="1000" fill="url(#violet-glow)"/>

  <!-- Architecture trace: primary captions route in portfolio blue. -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" font-weight="600" letter-spacing=".11em">
    <g fill="none" stroke="#5b9bff" stroke-width="1.4" stroke-opacity=".66">
      <path d="M630 104H860"/>
      <path d="M1020 104h190"/>
      <path d="M1406 104h54"/>
      <path d="M850 99l10 5-10 5M1200 99l10 5-10 5M1450 99l10 5-10 5"/>
    </g>
    <g fill="#05080f" stroke="#5b9bff" stroke-width="1.4">
      <rect x="470" y="77" width="160" height="54" rx="10"/>
      <rect x="860" y="77" width="160" height="54" rx="10"/>
      <rect x="1210" y="77" width="196" height="54" rx="10"/>
      <rect x="1460" y="77" width="122" height="54" rx="10"/>
    </g>
    <g fill="#8fb7ff">
      <text x="550" y="109" text-anchor="middle">YT-DLP</text>
      <text x="940" y="109" text-anchor="middle">CAPTIONS</text>
      <text x="1308" y="109" text-anchor="middle">SENTENCES</text>
      <text x="1521" y="109" text-anchor="middle">DEEPL</text>
    </g>
    <g fill="#5b9bff">
      <circle cx="488" cy="104" r="4"/>
      <circle cx="878" cy="104" r="4"/>
      <circle cx="1228" cy="104" r="4"/>
      <circle cx="1478" cy="104" r="4"/>
    </g>

    <!-- Fallback branch: only used when captions do not exist. -->
    <g fill="none" stroke="#b14aed" stroke-width="1.35" stroke-opacity=".72">
      <path d="M940 131v58h60"/>
      <path d="M1130 189h30"/>
      <path d="M1308 162v-31"/>
      <path d="M990 184l10 5-10 5M1150 184l10 5-10 5M1303 141l5-10 5 10"/>
    </g>
    <g fill="#090a17" stroke="#b14aed" stroke-width="1.25">
      <rect x="1000" y="162" width="130" height="54" rx="10"/>
      <rect x="1160" y="162" width="148" height="54" rx="10"/>
    </g>
    <g fill="#c9a2f5">
      <text x="1065" y="194" text-anchor="middle">FFMPEG</text>
      <text x="1234" y="194" text-anchor="middle">WHISPER.CPP</text>
    </g>
    <text x="958" y="151" fill="#c9a2f5" font-size="12" letter-spacing=".08em">NO CAPTIONS</text>
  </g>

  <!-- Soft signal strokes add depth without pretending there is a waveform UI. -->
  <g fill="none" stroke-linecap="round" opacity=".24">
    <path d="M134 211c80-28 142 28 222 0s142 28 222 0" stroke="#2b6bff" stroke-width="2"/>
    <path d="M1480 255c58-19 106 19 164 0s106 19 164 0" stroke="#b14aed" stroke-width="2"/>
  </g>

  <!-- Illustrative result view: timestamped source and translation rows. -->
  <rect x="0" y="286" width="2000" height="420" fill="url(#band)"/>
  <line x1="0" y1="286" x2="2000" y2="286" stroke="#5b9bff" stroke-opacity=".42"/>
  <line x1="0" y1="706" x2="2000" y2="706" stroke="#b14aed" stroke-opacity=".34"/>
  <g font-family="'Helvetica Neue', Inter, Arial, sans-serif">
    <text x="1000" y="332" text-anchor="middle" fill="#8d94b2" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="16" font-weight="600" letter-spacing=".2em">EN &#8594; ES  &#183;  CAPTIONS FIRST  &#183;  DEEPL</text>

    <text x="430" y="395" fill="#8a8fac" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">00:08</text>
    <text x="560" y="395" fill="#edf1f8" font-size="27" font-weight="560">The system boundary is the request.</text>
    <text x="560" y="427" fill="#9a94b8" font-size="21" font-style="italic">El l&#237;mite del sistema es la petici&#243;n.</text>

    <text x="430" y="482" fill="#8a8fac" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">00:14</text>
    <text x="560" y="482" fill="#edf1f8" font-size="27" font-weight="560">Context stays only for this run.</text>
    <text x="560" y="514" fill="#9a94b8" font-size="21" font-style="italic">El contexto vive solo en esta ejecuci&#243;n.</text>

    <rect x="400" y="538" width="1280" height="94" rx="11" fill="url(#active-row)"/>
    <rect x="400" y="538" width="3" height="94" rx="1.5" fill="#5b9bff"/>
    <rect x="403" y="538" width="2" height="94" fill="#b14aed" opacity=".74" filter="url(#blue-shadow)"/>
    <text x="430" y="579" fill="#7eaaff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">00:21</text>
    <text x="560" y="579" fill="url(#karaoke)" font-size="27" font-weight="700">Your history stays in this browser.</text>
    <text x="560" y="611" fill="#c4b5e0" font-size="21" font-style="italic">Tu historial se queda en este navegador.</text>

    <text x="430" y="675" fill="#6e7d99" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="19">00:29</text>
    <text x="560" y="675" fill="#a2b0c9" font-size="27" font-weight="540">Translation happens on whole sentences.</text>
    <text x="560" y="701" fill="#6e7d99" font-size="20" font-style="italic">Se traduce por frases enteras.</text>
  </g>

  <!-- Quiet technical texture; the HTML title occupies the lower-left. -->
  <g fill="#5b9bff" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing=".09em" opacity=".1">
    <text x="1240" y="776">SSE / STAGE: PREPARING_RESULT</text>
    <text x="1240" y="806">SEGMENTS / SENTENCE-ALIGNED</text>
    <text x="1240" y="836">PERSISTENCE / BROWSER ONLY</text>
    <text x="1570" y="776">HTTP / 200</text>
    <text x="1570" y="806">LANG / AUTO</text>
    <text x="1570" y="836">EXPORT / TXT SRT</text>
  </g>
  <rect x="0" y="688" width="2000" height="312" fill="url(#lower-vignette)"/>
</svg>
